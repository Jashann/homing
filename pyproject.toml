[project]
name = "homing"
version = "0.1.0"
description = "Helps a business pay uncollected money back to its owners through PayPal Payouts, after checking their documents against the account record."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "reportlab>=5.1.0",
    "python-multipart>=0.0.33",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the real PayPal sandbox (run with -m live; needs ~/.paypal_sandbox)"]
